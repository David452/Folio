<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 40 410 160" width="410" height="160" role="img" aria-label="Folio logo">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- icon: stacked portfolio pages / blocks -->
  <g transform="translate(40,40)">
    <rect x="0" y="0" width="160" height="160" rx="36" fill="url(#g)"/>
    <!-- back page -->
    <rect x="38" y="26" width="84" height="104" rx="10" fill="#ffffff" opacity="0.35"/>
    <!-- front page -->
    <rect x="30" y="34" width="84" height="104" rx="10" fill="#ffffff"/>
    <!-- content blocks -->
    <rect x="42" y="46" width="60" height="10" rx="4" fill="#2563eb"/>
    <rect x="42" y="64" width="60" height="30" rx="6" fill="#06b6d4"/>
    <rect x="42" y="102" width="40" height="6" rx="3" fill="#94a3b8"/>
    <rect x="42" y="114" width="52" height="6" rx="3" fill="#94a3b8"/>
  </g>
  <!-- wordmark -->
  <text x="236" y="138" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="96" font-weight="700" fill="#0f172a" letter-spacing="-3">Folio</text>
  <text x="240" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#64748b" letter-spacing="1">build your portfolio</text>
</svg>
